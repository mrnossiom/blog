{% macro head(config) %}
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

    {# CSS Style Sheets -#}
    <link rel="stylesheet" href="{{ get_url(path="/styles/main.css", trailing_slash=false) | safe }}">
    <link rel="stylesheet" href="{{ get_url(path="/styles/font-hack-subset.css", trailing_slash=false) | safe }}">

    <noscript>
        <link rel="stylesheet" href="{{ get_url(path="/styles/no-js.css", trailing_slash=false) | safe }}">
    </noscript>

    {# Mastodon Website verification and content attribution -#}
    <link rel="me" href="https://piaille.fr/@wiro">
    <meta name="fediverse:creator" content="@wiro@piaille.fr">

    {# Ping back home for stats using https://codeberg.org/kytta/diet-goat -#}
    <script type="module">
        import { count } from "{{ get_url(path="/js/dietgoat.js", trailing_slash=false) | safe }}";
        count("https://stats.wiro.world/count");
    </script>
{% endmacro head %}
