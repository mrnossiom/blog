name: Build and deploy website

on:
  push:
    branches:
      - public
  workflow_dispatch:

concurrency:
  group: "website"
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://wiro.world
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix build .#website

      - run: |
          nix run .#git-pages-cli -- \
            https://wiro.world \
            --password "${GIT_PAGES_CHALLENGE}" \
            --server grebedoc.dev \
            --upload-dir result
        env:
          GIT_PAGES_CHALLENGE: ${{ secrets.GIT_PAGES_CHALLENGE }}
